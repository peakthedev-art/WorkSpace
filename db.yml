services:
	mysql:
		image: mysql:8.4
		container_name: workspace-mysql
		restart: unless-stopped
		environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
		ports:
			- "3306:3306"
		volumes:
			- mysql_data:/var/lib/mysql
		healthcheck:
			test: ["CMD-SHELL", "mysqladmin ping -h localhost -u workspace -pworkspace_password"]
			interval: 5s
			timeout: 5s
			retries: 5

volumes:
	mysql_data:
  commandes_sql
