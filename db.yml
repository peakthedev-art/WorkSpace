services:
	mysql:
		image: mysql:8.4
		container_name: workspace-mysql
		restart: unless-stopped
		environment:
			MYSQL_ROOT_PASSWORD: root_password
			MYSQL_DATABASE: workspace
			MYSQL_USER: workspace
			MYSQL_PASSWORD: workspace_password
		ports:
			- "3306:3306"
		volumes:
			- mysql_data:/var/lib/mysql
		healthcheck:
			test: ["CMD-SHELL", "mysqladmin ping -h localhost -u workspace -pworkspace_password"]
			interval: 5s
			timeout: 5s
			retries: 5

volumes:
	mysql_data:
